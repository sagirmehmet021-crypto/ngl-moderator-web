
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGL Yönetici Girişi</title>
<style>
body{margin:0;background:#090909;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh}
.box{background:#171717;padding:30px;border:1px solid #8d0000;border-radius:14px;width:min(340px,85%)}
h2{color:#ff2929;text-align:center}
input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:7px}
input{background:#222;color:white;border:1px solid #555}
button{background:#b00000;color:white;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2>🐉 NGL MODERATOR</h2>
<p>Yönetici Girişi</p>
<form id="login">
<input id="username" placeholder="Kullanıcı adı" required>
<input id="password" type="password" placeholder="Şifre" required>
<button type="submit">Giriş Yap</button>
<p id="message"></p>
</form>
</div>
<script>
document.getElementById("login").addEventListener("submit",async e=>{
e.preventDefault();
const message=document.getElementById("message");
});
</script>
</body>
</html>
